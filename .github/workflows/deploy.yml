name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        run: pip install -r requirements.txt

      - name: Install scraper dependencies
        run: pip install -r requirements.scraper.txt

      - name: Run bot tests
        run: python -m pytest tests/football_bot

      - name: Run scraper tests
        run: python -m pytest tests/scraper

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy on server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          envs: DEPLOY_APP_DIR,DEPLOY_BRANCH
          script: |
            export DEPLOY_APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            export DEPLOY_BRANCH="${{ secrets.DEPLOY_BRANCH || 'main' }}"
            bash "${DEPLOY_APP_DIR}/scripts/deploy.sh"
